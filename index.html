<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pac-Vocab 復古單詞特訓</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00FFFF;
            --neon-pink: #FF00FF;
            --neon-yellow: #FFFF00;
            --neon-red: #FF0033;
            --neon-green: #00FF33;
            --bg-color: #050505;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            color: white;
            touch-action: none;
        }

        /* 背景網格線 - 營造復古感 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* UI 覆蓋層 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* 標題與按鈕 */
        h1 {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            text-align: center;
            line-height: 1.5;
            font-size: clamp(20px, 4vw, 36px);
            margin-bottom: 40px;
            flex-shrink: 0;
        }

        .menu-btn {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Press Start 2P', monospace;
            padding: 15px 30px;
            margin: 10px 0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 5px var(--neon-blue);
            box-shadow: 0 0 10px inset rgba(0,255,255,0.2), 0 0 10px rgba(0,255,255,0.2);
            width: 90%;
            max-width: 600px;
        }

        .menu-btn:hover, .menu-btn:active {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* 讓主選單支援滾動以容納大量單元 */
        #unit-buttons {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            align-items: center;
            padding: 10px;
        }
        #unit-buttons::-webkit-scrollbar { width: 5px; }
        #unit-buttons::-webkit-scrollbar-thumb { background: var(--neon-blue); }

        /* 遊戲中 UI 元素 */
        #game-header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: var(--neon-yellow);
            font-size: 16px;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        /* 第2關 輸入框與提示 */
        #l2-ui {
            position: absolute;
            bottom: 10%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            display: none;
        }

        #l2-hint {
            color: var(--neon-pink);
            font-size: 18px;
            margin-bottom: 15px;
            height: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--neon-pink);
        }

        #l2-input {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-blue);
            color: var(--neon-yellow);
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            padding: 15px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px var(--neon-blue);
            text-transform: uppercase; /* 強制顯示大寫 */
        }

        /* 錯誤搖晃動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.4s;
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 15px var(--neon-red) !important;
            color: var(--neon-red) !important;
        }

        /* 結算畫面 */
        #summary-list {
            width: 90%;
            max-width: 600px;
            max-height: 50vh;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-pink);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px inset rgba(255,0,255,0.3);
        }
        
        /* 隱藏捲軸但可滾動 */
        #summary-list::-webkit-scrollbar { width: 5px; }
        #summary-list::-webkit-scrollbar-thumb { background: var(--neon-pink); }

        .mistake-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 10px 0;
            font-size: 12px;
            line-height: 1.6;
        }
        .mistake-item span:first-child { color: var(--neon-yellow); }
        .mistake-item span:last-child { color: white; text-align: right; max-width: 60%; }

    </style>
</head>

         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let state = 'MENU'; // 'MENU', 'L1', 'L2', 'SUMMARY'
        
        // 當前遊戲資料
        let currentWords = []; 
        let currentUnitName = "";

        // UI 元素
        const screenMenu = document.getElementById('screen-menu');
        const screenSummary = document.getElementById('screen-summary');
        const l2Ui = document.getElementById('l2-ui');
        const l2Input = document.getElementById('l2-input');
        const l2Hint = document.getElementById('l2-hint');
        const gameHeader = document.getElementById('game-header');
        const headerText = document.getElementById('header-text');

        // L1 狀態
        let l1Cards = [];
        let l1SelectedCard = null;
        let l1MatchedCount = 0;
        let mouseX = 0, mouseY = 0;

        // L2 狀態
        let l2Queue = [];
        let l2CurrentWord = null;
        let pacman = { x: 0, y: 0, targetX: 0, radius: 20, mouthOpen: 0 };
        let dots = [];
        let l2WrongAttempts = 0; // 追蹤連續錯誤次數

        /**
         * ==========================================
         * 3. 工具與初始化
         * ==========================================
         */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if(state === 'L1') initL1Positions();
            if(state === 'L2') initL2Positions();
        }
        window.addEventListener('resize', resize);
        resize();

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if(id) document.getElementById(id).classList.add('active');
        }

        // 清理輸入 (去頭尾空白、轉小寫)
        const formatInput = (str) => str.trim().toLowerCase();

        // 產生提示字串 (例如: M_ _ _ _ )
        function generateHint(enStr) {
            if (!enStr) return '';
            let hint = enStr.charAt(0).toUpperCase();
            for (let i = 1; i < enStr.length; i++) {
                hint += (enStr[i] === ' ') ? '  ' : ' _';
            }
            return hint;
        }

        /**
         * ==========================================
         * 4. 遊戲流程控制
         * ==========================================
         */
        function initMenu() {
            state = 'MENU';
            switchScreen('screen-menu');
            gameHeader.style.display = 'none';
            l2Ui.style.display = 'none';
            
            const btnContainer = document.getElementById('unit-buttons');
            btnContainer.innerHTML = '';
            
            VOCAB_DATA.forEach((unit, idx) => {
                let btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = `${unit.unitID}: ${unit.categoryName}`;
                btn.onclick = () => startSession(unit.words, unit.unitID);
                btnContainer.appendChild(btn);
            });
        }

        function startSession(wordsArray, title) {
            mistakesMap.clear();
            currentUnitName = title;
            currentWords = JSON.parse(JSON.stringify(wordsArray)); // Deep copy
            startL1();
        }

        function startRetrySession() {
            currentWords = Array.from(mistakesMap.values());
            mistakesMap.clear();
            currentUnitName = "錯題特訓";
            startL1();
        }

        // --- LEVEL 1 (記憶翻卡) ---
        function startL1() {
            state = 'L1';
            switchScreen('');
            gameHeader.style.display = 'block';
            headerText.innerText = `${currentUnitName} | L1: MATCHING`;
            l2Ui.style.display = 'none';
            
            l1MatchedCount = 0;
            l1Cards = [];
            l1SelectedCard = null;

            let enWords = shuffle([...currentWords]);
            let cnWords = shuffle([...currentWords]);

            enWords.forEach(w => l1Cards.push({ id: w.en, text: w.en, type: 'en', matched: false, state: 'normal' }));
            cnWords.forEach(w => l1Cards.push({ id: w.en, text: w.cn, type: 'cn', matched: false, state: 'normal' }));

            initL1Positions();
        }

        function initL1Positions() {
            let isMobile = width < 768;
            let cols = isMobile ? 2 : 4;
            let cardW = isMobile ? (width * 0.42) : (width * 0.2);
            let cardH = isMobile ? 45 : 60; // 在手機上稍微縮小高度以容納更多卡片
            let gapY = isMobile ? 10 : 20; // 縮小垂直間距
            let gapX = 10; 
            let startX = width / 2 - ((cols - 1) * (cardW + gapX)) / 2;
            let startY = 80;

            let enCards = l1Cards.filter(c => c.type === 'en');
            let cnCards = l1Cards.filter(c => c.type === 'cn');

            // 排列：上半部英文，下半部中文
            enCards.forEach((c, i) => {
                c.x = startX + (i % cols) * (cardW + gapX);
                c.y = startY + Math.floor(i / cols) * (cardH + gapY);
                c.w = cardW; c.h = cardH;
            });

            let cnStartY = startY + Math.floor((enCards.length - 1) / cols) * (cardH + gapY) + cardH + 40;
            cnCards.forEach((c, i) => {
                c.x = startX + (i % cols) * (cardW + gapX);
                c.y = cnStartY + Math.floor(i / cols) * (cardH + gapY);
                c.w = cardW; c.h = cardH;
            });
        }

        // --- LEVEL 2 (吃豆打字) ---
        function startL2() {
            state = 'L2';
            headerText.innerText = `${currentUnitName} | L2: PAC-TYPING`;
            l2Ui.style.display = 'flex';
            
            l2Queue = shuffle([...currentWords]);
            l2CurrentWord = l2Queue[0];
            l2Hint.innerText = '';
            l2Hint.style.color = 'var(--neon-pink)';
            l2Input.value = '';
            l2WrongAttempts = 0; // 初始化錯誤次數
            l2Input.focus();

            initL2Positions();
        }

        function initL2Positions() {
            let trackY = height * 0.4;
            let startX = width * 0.1;
            let endX = width * 0.9;
            let spacing = (endX - startX) / Math.max(1, currentWords.length);

            dots = [];
            for(let i=0; i<currentWords.length; i++) {
                dots.push({ x: startX + i * spacing + spacing/2, y: trackY, eaten: false });
            }

            pacman.radius = Math.min(25, width * 0.05);
            pacman.x = startX - pacman.radius;
            pacman.y = trackY;
            pacman.targetX = pacman.x;
        }

        // 處理打字邏輯
        l2Input.addEventListener('keydown', (e) => {
            if (state !== 'L2' || e.key !== 'Enter') return;
            
            let inputStr = formatInput(l2Input.value);
            let targetStr = formatInput(l2CurrentWord.en);

            if (inputStr === targetStr) {
                // 正確：吃豆人前進，清空輸入，下一題
                l2Input.value = '';
                l2Hint.innerText = '';
                l2Hint.style.color = 'var(--neon-pink)'; // 恢復預設提示顏色
                l2Input.classList.remove('shake');
                l2WrongAttempts = 0; // 答對後重置錯誤次數
                
                let dotIndex = currentWords.length - l2Queue.length;
                if(dots[dotIndex]) {
                    pacman.targetX = dots[dotIndex].x;
                    dots[dotIndex].eaten = true;
                }

                l2Queue.shift();
                if (l2Queue.length === 0) {
                    setTimeout(() => showSummary(), 1000);
                } else {
                    l2CurrentWord = l2Queue[0];
                }
            } else {
                // 錯誤：搖晃，不保留輸入，顯示提示，記錄錯題
                l2Input.classList.remove('shake');
                void l2Input.offsetWidth; // trigger reflow
                l2Input.classList.add('shake');
                
                l2WrongAttempts++; // 增加錯誤次數
                
                if (l2WrongAttempts >= 3) {
                    // 連續錯誤 3 次，直接顯示正確答案
                    l2Hint.innerText = "答案: " + l2CurrentWord.en.toUpperCase();
                    l2Hint.style.color = "var(--neon-yellow)"; // 改變顏色以作區別
                } else {
                    // 顯示一般遮罩提示
                    l2Hint.innerText = generateHint(l2CurrentWord.en);
                    l2Hint.style.color = "var(--neon-pink)";
                }
                
                mistakesMap.set(l2CurrentWord.en, l2CurrentWord);
            }
        });

        // --- 結算畫面 ---
        function showSummary() {
            state = 'SUMMARY';
            switchScreen('screen-summary');
            gameHeader.style.display = 'none';
            l2Ui.style.display = 'none';

            const listEl = document.getElementById('summary-list');
            const btnRetry = document.getElementById('btn-retry');
            const titleEl = document.getElementById('summary-title');
            
            listEl.innerHTML = '';
            
            if (mistakesMap.size === 0) {
                titleEl.innerText = "PERFECT CLEAR!";
                titleEl.style.color = "var(--neon-green)";
                btnRetry.style.display = 'none';
                listEl.innerHTML = '<div style="text-align:center; color:white; padding: 20px;">太棒了！你沒有任何錯誤。</div>';
            } else {
                titleEl.innerText = "MISTAKES FOUND";
                titleEl.style.color = "var(--neon-pink)";
                btnRetry.style.display = 'block';
                
                mistakesMap.forEach((word) => {
                    let item = document.createElement('div');
                    item.className = 'mistake-item';
                    item.innerHTML = `<span>${word.en}</span><span>${word.cn}</span>`;
                    listEl.appendChild(item);
                });
            }
        }

        document.getElementById('btn-home').onclick = initMenu;
        document.getElementById('btn-retry').onclick = startRetrySession;

        /**
         * ==========================================
         * 5. 互動與渲染 (Canvas)
         * ==========================================
         */
        // 點擊事件 (針對 L1)
        canvas.addEventListener('pointerdown', (e) => {
            if (state !== 'L1') return;
            
            let rect = canvas.getBoundingClientRect();
            let px = e.clientX - rect.left;
            let py = e.clientY - rect.top;

            // 尋找點擊的卡片
            for (let c of l1Cards) {
                if (!c.matched && px > c.x - c.w/2 && px < c.x + c.w/2 && py > c.y - c.h/2 && py < c.y + c.h/2) {
                    
                    if (!l1SelectedCard) {
                        // 選取第一張
                        l1SelectedCard = c;
                        c.state = 'selected';
                    } else if (l1SelectedCard !== c) {
                        // 選取第二張
                        if (l1SelectedCard.type !== c.type && l1SelectedCard.id === c.id) {
                            // 答對
                            l1SelectedCard.matched = true;
                            c.matched = true;
                            l1MatchedCount += 2;
                            l1SelectedCard = null;
                            
                            // 檢查 L1 過關
                            if (l1MatchedCount === l1Cards.length) {
                                setTimeout(startL2, 800);
                            }
                        } else {
                            // 答錯
                            mistakesMap.set(c.id, currentWords.find(w => w.en === c.id));
                            c.state = 'error';
                            l1SelectedCard.state = 'error';
                            let temp1 = l1SelectedCard;
                            let temp2 = c;
                            l1SelectedCard = null;
                            
                            setTimeout(() => {
                                temp1.state = 'normal';
                                temp2.state = 'normal';
                            }, 500);
                        }
                    }
                    break;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            let rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // 繪圖核心
        function render() {
            ctx.clearRect(0, 0, width, height);

            if (state === 'L1') {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                l1Cards.forEach(c => {
                    if (c.matched) return; // 答對的隱藏
                    
                    let isHover = (mouseX > c.x - c.w/2 && mouseX < c.x + c.w/2 && mouseY > c.y - c.h/2 && mouseY < c.y + c.h/2);
                    
                    // 決定卡片顏色
                    let borderColor = '#333';
                    let bgColor = 'rgba(0,0,0,0.8)';
                    let textColor = 'white';
                    let shadow = 0;

                    if (c.state === 'selected') {
                        borderColor = 'var(--neon-yellow)';
                        shadow = 15;
                    } else if (c.state === 'error') {
                        borderColor = 'var(--neon-red)';
                        shadow = 15;
                    } else if (isHover) {
                        borderColor = 'var(--neon-blue)';
                        shadow = 10;
                    }

                    // 繪製卡片
                    ctx.shadowBlur = shadow;
                    ctx.shadowColor = borderColor;
                    ctx.strokeStyle = borderColor;
                    ctx.fillStyle = bgColor;
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    ctx.rect(c.x - c.w/2, c.y - c.h/2, c.w, c.h);
                    ctx.fill();
                    ctx.stroke();
                    ctx.shadowBlur = 0; // 重置陰影

                    // 繪製文字 (自適應大小)
                    ctx.fillStyle = (c.state === 'selected' || c.state === 'error') ? borderColor : textColor;
                    let fontSize = c.type === 'en' ? 12 : 14;
                    ctx.font = `${fontSize}px 'Press Start 2P'`;
                    
                    // 若文字太長，截斷或縮小 (簡單處理)
                    let displayTxt = c.text;
                    if(ctx.measureText(displayTxt).width > c.w - 10) {
                        ctx.font = `10px 'Press Start 2P'`;
                    }
                    ctx.fillText(displayTxt, c.x, c.y);
                });
            } 
            else if (state === 'L2') {
                // 1. 繪製軌道
                ctx.strokeStyle = '#1919A6'; // 深藍色軌道
                ctx.lineWidth = 4;
                ctx.beginPath();
                let trackY = height * 0.4;
                ctx.moveTo(0, trackY - 20); ctx.lineTo(width, trackY - 20);
                ctx.moveTo(0, trackY + 20); ctx.lineTo(width, trackY + 20);
                ctx.stroke();

                // 2. 繪製豆子
                dots.forEach(d => {
                    if(!d.eaten) {
                        ctx.fillStyle = '#FFB8AE'; // 粉紅豆
                        ctx.fillRect(d.x - 4, d.y - 4, 8, 8);
                    }
                });

                // 3. 繪製吃豆人 (平滑移動動畫)
                pacman.x += (pacman.targetX - pacman.x) * 0.15;
                
                // 嘴巴開合動畫
                pacman.mouthOpen = Math.abs(Math.sin(Date.now() / 150)) * 0.25; 
                let startAngle = pacman.mouthOpen * Math.PI;
                let endAngle = (2 - pacman.mouthOpen) * Math.PI;

                ctx.fillStyle = 'var(--neon-yellow)';
                ctx.beginPath();
                ctx.arc(pacman.x, pacman.y, pacman.radius, startAngle, endAngle);
                ctx.lineTo(pacman.x, pacman.y);
                ctx.fill();

                // 4. 繪製當前中文題目 (Canvas 上方)
                if (l2CurrentWord) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'white';
                    ctx.font = `20px 'Press Start 2P'`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'var(--neon-blue)';
                    ctx.fillText(l2CurrentWord.cn, width / 2, height * 0.6);
                    ctx.shadowBlur = 0;
                }
            }

            requestAnimationFrame(render);
        }

        // 啟動
        initMenu();
        render();

    </script>
</body>
</html>
